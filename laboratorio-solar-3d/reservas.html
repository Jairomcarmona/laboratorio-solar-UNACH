<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservas · Laboratorio Remoto Solar UNACH</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal">
<main class="portalcard glass wide">
  <h1>Reservas del banco</h1>
  <p class="lead" id="who">Cargando tu cuenta…</p>
  <section aria-labelledby="hNew" id="newBox" hidden>
    <h2 id="hNew">Nueva reserva</h2>
    <form id="bookForm" novalidate>
      <label for="bStart">Inicio</label><input id="bStart" type="datetime-local" required>
      <label for="bMin">Duración (minutos)</label><input id="bMin" type="number" min="15" max="120" step="15" value="60" required>
      <p id="bMsg" class="msg" role="alert" aria-live="assertive" hidden></p>
      <button class="btn accent" type="submit">Reservar</button>
    </form>
  </section>
  <section aria-labelledby="hMine">
    <h2 id="hMine">Mis reservas</h2>
    <ul id="list" class="blist"></ul>
    <p class="hint" id="empty" hidden>No tienes reservas próximas.</p>
  </section>
  <div class="rowbtn"><a class="btn accent" href="index.html?source=ws" id="enter">Entrar al laboratorio</a><button class="btn" id="logout" type="button">Cerrar sesión</button></div>
</main>
<script src="js/portal.js"></script>
</body>
</html>
