# Mosquitto 2.x — sin acceso anónimo, usuarios con contraseña y ACL por servicio.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
max_packet_size 262144
max_inflight_messages 50
max_queued_messages 2000
connection_messages false

# Red interna entre contenedores: TLS. El broker NO se publica en el host ni en internet (ver docker-compose.yml: sin "ports").
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
