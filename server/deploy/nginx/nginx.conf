# Nginx: único punto de entrada desde internet (443). TLS moderno, cabeceras de seguridad, límite de tasa, WebSocket y cámaras con autenticación.
# La política CSP debe ser idéntica a labsolar.gateway.settings.CSP (la prueba tests/test_deploy_files.py lo comprueba).
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;

  # límites de tasa por IP: el acceso es el punto más atacado
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    limit_conn conn 40;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(js|css|png|jpg|svg|woff2)$ { expires 1h; add_header Cache-Control "public"; }

    location = /api/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://gateway:8000;
      include /etc/nginx/proxy_params;
      proxy_read_timeout 30s;
    }
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://gateway:8000;
      include /etc/nginx/proxy_params;
      proxy_read_timeout 30s;
    }
    location /ws {
      proxy_pass http://gateway:8000;
      include /etc/nginx/proxy_params;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # Cámaras: solo con sesión válida (la pasarela responde 200/401 en /api/auth/check). MediaMTX no se publica fuera.
    location = /_auth {
      internal;
      proxy_pass http://gateway:8000/api/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
    }
    location /cam/ {
      auth_request /_auth;
      proxy_pass http://mediamtx:8888/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
    location ^~ /cam-webrtc/ {
      auth_request /_auth;
      proxy_pass http://mediamtx:8889/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
