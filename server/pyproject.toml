[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labsolar"
version = "0.1.0"
description = "Servidor del Laboratorio Solar Remoto UNACH: contrato, puente, pasarela, registrador y gemelo"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6",
  "numpy>=1.26",
  "pandas>=2",
  "scipy>=1.11",
  "pvlib>=0.11",
]

[project.optional-dependencies]
bridge = ["aiomqtt>=2.0", "pymodbus>=3.6", "asyncua>=1.1"]
daq = ["nidaqmx>=1.0"]
gateway = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "argon2-cffi>=23", "aiomqtt>=2.0", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12"]

[project.scripts]
labsolar-bridge = "labsolar.bridge.main:main"
labsolar-gateway = "labsolar.gateway.main:main"
labsolar-recorder = "labsolar.recorder.main:main"
labsolar-twin = "labsolar.twin.main:main"
labsolar-fakebank = "labsolar.bridge.fakebank:main"

[tool.setuptools.packages.find]
include = ["labsolar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: necesita mosquitto y/o PostgreSQL locales"]
